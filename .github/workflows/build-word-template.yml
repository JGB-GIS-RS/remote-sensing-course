name: Build official Word template

on:
  push:
    paths:
      - 'scripts/build_word_template.py'
      - '.github/workflows/build-word-template.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependencies
        run: python -m pip install --disable-pip-version-check python-docx Pillow lxml

      - name: Generate DOCX and DOTX
        run: python scripts/build_word_template.py

      - name: Validate OOXML packages
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for name in (
              'template/Plantilla_Oficial_Serie_Tecnica_Teledeteccion_v1.0.docx',
              'template/Plantilla_Oficial_Serie_Tecnica_Teledeteccion_v1.0.dotx',
          ):
              p = Path(name)
              assert p.exists() and p.stat().st_size > 10000, name
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None, name
                  assert 'word/document.xml' in z.namelist(), name
          PY

      - name: Commit generated templates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template/Plantilla_Oficial_Serie_Tecnica_Teledeteccion_v1.0.docx \
                  template/Plantilla_Oficial_Serie_Tecnica_Teledeteccion_v1.0.dotx
          if git diff --cached --quiet; then
            echo 'Templates are already up to date.'
          else
            git commit -m 'build: regenerate official Word template v1.0'
            git push
          fi
